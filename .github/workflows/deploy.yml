name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: finance-tracker-api
  ECS_CLUSTER: finance-tracker-cluster
  ECS_SERVICE: finance-tracker-service
  S3_BUCKET: finance-tracker-ui
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  test-api:
    name: API Tests & Coverage
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISSABLED: "true"
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('api/pom.xml') }}
      - name: Run unit & integration tests
        env:
          SHOW_SQL: false
        run: |
          cd api
          mvn clean verify
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api/target/site/jacoco/
  test-ui:
    name: UI Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'
      - name: Install dependencies
        run: cd client && npm ci
      - name: Lint
        run: cd client && npm run lint
      - name: Check formatting
        run: cd client && npm run format:check
  deploy:
    name: Build & Deploy API + UI
    runs-on: ubuntu-latest
    needs: test-api
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # API: Build & Push to ECR
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
      - name: Build JAR
        run: cd api && mvn clean package --DskipTests
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, push API image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./api
          docker tag $REGISTRY/$ECR_REPOSITORY:IMAGE_TAG $REGISTRY/$ECR_REPOSITORY:latest
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest
      - name: Force ECS deployment
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment --region $AWS_REGION
      # UI: Build & Deploy to S3 + CloudFront
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'
      - name: Install dependencies
        run: cd client && npm ci
      - name: Build React app
        run: |
          cd client
          VITE_API_URL=${{ secrets.api_url }} \
          npm run build
      - name: Sync to S3
        run: aws s3 sync ./client/dist/ s3://${{ env.S3_BUCKET }}/ --delete
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
          --paths "/*"
